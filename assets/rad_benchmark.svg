<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#11192e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="mutedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="598" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="36" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">RAD vs. Stock llama.cpp &amp; RTX PRO 6000 Blackwell — Inkling-2-Mini</text>
  <text x="36" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Single-User Decode &amp; Prefill on AMD Radeon AI PRO R9700 (32 GB, ~$1,250) — Higher is Better</text>

  <rect x="36" y="90" width="888" height="254" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="56" y="120" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Single-User Decode Throughput (tok/s)</text>

  <line x1="521" y1="132" x2="521" y2="328" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.65"/>
  <text x="529" y="144" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#94a3b8">Unsloth 6000 Pro (125)</text>

  <text x="56" y="166" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Stock llama.cpp (R9700 + DSpark)</text>
  <rect x="340" y="150" width="102" height="24" rx="5" fill="url(#slateGrad)"/>
  <text x="452" y="167" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#94a3b8">70.5 tok/s (1.00×)</text>

  <text x="56" y="204" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">RAD (R9700, No-Spec hipGraph)</text>
  <rect x="340" y="188" width="141" height="24" rx="5" fill="url(#cyanGrad)"/>
  <text x="491" y="205" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#22d3ee">97.0 tok/s (1.38×)</text>

  <text x="56" y="242" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Unsloth RTX PRO 6000 Blackwell (Claimed)</text>
  <rect x="340" y="226" width="181" height="24" rx="5" fill="url(#mutedGrad)"/>
  <text x="531" y="243" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#cbd5e1">125.0 tok/s (~$8,500 GPU)</text>

  <text x="56" y="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">RAD (R9700 + DSpark K=6)</text>
  <rect x="340" y="264" width="215" height="24" rx="5" fill="url(#emeraldGrad)"/>
  <text x="565" y="281" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#34d399">148.2 tok/s (2.10×)</text>

  <text x="56" y="318" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">RAD (R9700 + DFlash 2 K=8)</text>
  <rect x="340" y="302" width="400" height="24" rx="5" fill="url(#greenGrad)"/>
  <text x="750" y="319" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">275.9 tok/s (3.91×)</text>

  <rect x="36" y="362" width="888" height="196" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="56" y="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Long-Prompt Prefill Throughput — pp2048 (tok/s)</text>

  <text x="56" y="438" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Stock llama.cpp (R9700, FlashAttn)</text>
  <rect x="340" y="422" width="91" height="24" rx="5" fill="url(#slateGrad)"/>
  <text x="441" y="439" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#94a3b8">765.5 tok/s (1.00×)</text>

  <text x="56" y="480" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">RAD + DFlash 2 (pp2048 Batched Inject)</text>
  <rect x="340" y="464" width="396" height="24" rx="5" fill="url(#orangeGrad)"/>
  <text x="746" y="481" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#fb923c">3,342.2 tok/s (4.37×)</text>

  <text x="56" y="522" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">RAD (R9700, pp2048 LDS WMMA)</text>
  <rect x="340" y="506" width="400" height="24" rx="5" fill="url(#amberGrad)"/>
  <text x="750" y="523" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">3,377.7 tok/s (4.41×)</text>

  <text x="36" y="582" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#64748b">Measured on identical AMD Radeon AI PRO R9700 (gfx1201, ROCm) via `rad bench` | Inkling-2-Mini Q4_K_XL + DFlash 2 | github.com/metaspartan/RAD</text>
</svg>
