  <text x="651" y="299" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">1,277.8 tok/s</text>

  <text x="56" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=64 LDS WMMA MoE (18.2 tok/s/user)</text>
  <rect x="345" y="317" width="269" height="22" rx="5" fill="url(#cyanGrad)"/>
  <text x="624" y="333" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">1,162.2 tok/s</text>

  <text x="56" y="366" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=128 LDS WMMA MoE (14.5 tok/s/user)</text>
  <rect x="345" y="351" width="430" height="22" rx="5" fill="url(#purpleGrad)"/>
  <text x="785" y="367" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">1,856.0 tok/s</text>

  <text x="36" y="416" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#64748b">Measured on a single AMD Radeon AI PRO R9700 (32 GB, gfx1201, ROCm) via `rad bench` | github.com/metaspartan/RAD</text>
