  <rect x="1" y="1" width="958" height="432" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="36" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">RAD v0.14.0 Multi-User Scaling — Inkling-2-Mini on Single R9700</text>
  <text x="36" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Aggregate Decode Throughput (tok/s) with Continuous Batching, blockIdx.z Hot-Expert MoE &amp; Batched DFlash 2</text>

  <rect x="36" y="90" width="888" height="304" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <text x="56" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">B=4 Batched DFlash 2 K=4 (127.3 tok/s/user)</text>
  <rect x="345" y="113" width="118" height="22" rx="5" fill="url(#tealGrad)"/>
  <text x="473" y="129" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">509.3 tok/s</text>

  <text x="56" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=8 Continuous Batching (80.4 tok/s/user)</text>
