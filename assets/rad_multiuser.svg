  <text x="567" y="299" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">1,409.8 tok/s (2,235 peak)</text>

  <text x="56" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=128 LDS WMMA MoE (14.5 tok/s/user)</text>
  <rect x="365" y="317" width="252" height="22" rx="5" fill="url(#purpleGrad)"/>
  <text x="627" y="333" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">1,856.0 tok/s</text>

  <text x="56" y="366" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=4 Hybrid DFlash 2 + K=128 (641.7/user)</text>
  <rect x="365" y="351" width="349" height="22" rx="5" fill="url(#greenGrad)"/>
  <text x="724" y="367" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">2,566.9 tok/s</text>

  <text x="56" y="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=16 Hybrid DFlash 2 + K=64 (195.1/user)</text>
