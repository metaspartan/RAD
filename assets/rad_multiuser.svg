  <text x="504" y="163" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">643.6 tok/s</text>

  <text x="56" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=8 Batched DSpark K=4 (57.3 tok/s/user)</text>
  <rect x="345" y="181" width="106" height="22" rx="5" fill="url(#greenGrad)"/>
  <text x="461" y="197" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">458.6 tok/s</text>

  <text x="56" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=8 Batched DFlash 2 K=4 (92.4 tok/s/user)</text>
  <rect x="345" y="215" width="171" height="22" rx="5" fill="url(#tealGrad)"/>
  <text x="526" y="231" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">739.3 tok/s</text>

  <text x="56" y="264" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=16 Continuous Batching (57.9 tok/s/user)</text>
