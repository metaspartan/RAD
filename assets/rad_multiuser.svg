  <text x="799" y="401" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">3,121.2 tok/s</text>

  <text x="56" y="434" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">B=8 Hybrid DFlash 2 + K=128 (395.6/user)</text>
  <rect x="365" y="419" width="430" height="22" rx="5" fill="url(#greenGrad)"/>
  <text x="805" y="435" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">3,164.9 tok/s</text>

  <text x="36" y="484" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#64748b">Measured on a single AMD Radeon AI PRO R9700 (32 GB, gfx1201, ROCm 7.14) via `rad bench` &amp; `rad serve` | github.com/metaspartan/RAD</text>
