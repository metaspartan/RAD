<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 502" width="960" height="502">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#11192e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="502" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="500" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="36" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">RAD v0.25.0 Multi-User Scaling: Inkling-2-Mini on Single R9700</text>
  <text x="36" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">Aggregate Decode Throughput (tok/s) with 32-Tok exp2f SWA/Q8KV FlashAttention &amp; 64-Tok Lookup</text>

  <rect x="36" y="90" width="888" height="372" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <text x="56" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">B=8 Continuous Batching (80.4 tok/s/user)</text>
  <rect x="365" y="113" width="73" height="22" rx="5" fill="url(#slateGrad)"/>
  <text x="448" y="129" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">643.6 tok/s</text>

  <text x="56" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=8 Batched DFlash 2 K=8 (93.6 tok/s/user)</text>
  <rect x="365" y="147" width="84" height="22" rx="5" fill="url(#tealGrad)"/>
  <text x="459" y="163" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">748.8 tok/s</text>

  <text x="56" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=16 Continuous Batching (57.9 tok/s/user)</text>
  <rect x="365" y="181" width="105" height="22" rx="5" fill="url(#slateGrad)"/>
  <text x="480" y="197" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">926.3 tok/s</text>

  <text x="56" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=16 Batched DFlash 2 K=8 (73.4 tok/s/user)</text>
  <rect x="365" y="215" width="132" height="22" rx="5" fill="url(#tealGrad)"/>
  <text x="507" y="231" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">1,174.4 tok/s</text>

  <text x="56" y="264" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=32 Continuous Batching (39.9 tok/s/user)</text>
  <rect x="365" y="249" width="145" height="22" rx="5" fill="url(#cyanGrad)"/>
  <text x="520" y="265" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">1,277.8 tok/s</text>

  <text x="56" y="298" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=128 LDS WMMA MoE (14.5 tok/s/user)</text>
  <rect x="365" y="283" width="210" height="22" rx="5" fill="url(#purpleGrad)"/>
  <text x="585" y="299" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">1,856.0 tok/s</text>

  <text x="56" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=4 Hybrid DFlash 2 + K=128 (710.2/user)</text>
  <rect x="365" y="317" width="320" height="22" rx="5" fill="url(#greenGrad)"/>
  <text x="695" y="333" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">2,840.7 tok/s</text>

  <text x="56" y="366" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=8 Live HTTP SSE (322.9 tok/s/user)</text>
  <rect x="365" y="351" width="343" height="22" rx="5" fill="url(#cyanGrad)"/>
  <text x="718" y="367" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">3,042.8 tok/s (2,200 full)</text>

  <text x="56" y="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">B=8 Hybrid DFlash 2 + K=128 (450.2/user)</text>
  <rect x="365" y="385" width="406" height="22" rx="5" fill="url(#greenGrad)"/>
  <text x="781" y="401" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">3,601.3 tok/s</text>

  <text x="56" y="434" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">B=16 Hybrid DFlash 2 + K=64 (238.4/user)</text>
  <rect x="365" y="419" width="430" height="22" rx="5" fill="url(#greenGrad)"/>
  <text x="805" y="435" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">3,815.1 tok/s</text>

  <text x="36" y="484" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#64748b">Measured on a single AMD Radeon AI PRO R9700 (32 GB, gfx1201, ROCm 7.14) via `rad bench` &amp; `rad serve` | github.com/metaspartan/RAD</text>
</svg>
