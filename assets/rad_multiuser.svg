  <text x="56" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">B=8 Batched DFlash 2 K=4 (92.6 tok/s/user)</text>
  <rect x="365" y="147" width="101" height="22" rx="5" fill="url(#tealGrad)"/>
