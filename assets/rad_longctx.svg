  <text x="36" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">RAD v0.11.0 Long-Context Decode &amp; Prefill (2K → 256K) on Single R9700</text>
  <text x="36" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">INT8 KV Cache + FP16 MoE Slots + 64Q GQA-3:1 Prefill + Unrolled nt=8 MoE + Split-96 Q48 WMMA (`--ctx 262144`)</text>

