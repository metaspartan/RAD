[package]
name = "rad-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rad-hip = { path = "../rad-hip" }
rad-gguf = { path = "../rad-gguf" }
anyhow = "1"
memmap2 = "0.9"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
