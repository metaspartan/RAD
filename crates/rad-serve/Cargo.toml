[package]
name = "rad-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rad-core = { path = "../rad-core" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
