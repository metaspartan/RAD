[workspace]
resolver = "2"
members = [
    "crates/rad-http",
    "crates/rad-hip",
    "crates/rad-gguf",
    "crates/rad-core",
    "crates/rad-serve",
]
exclude = [
    "crates/rad-cuda",
    "crates/rad-dsv41",
]

[workspace.package]
version = "0.32.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
