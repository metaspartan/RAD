name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write
  packages: write

jobs:
  build-linux-rocm:
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-24.04:6.4.1-complete
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install Rust & packaging tools
        run: |
          apt-get update && apt-get install -y curl pkg-config libssl-dev dpkg-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build HIP kernels and RAD binary
        run: |
          RAD_ARCH=gfx1201 bash kernels/rocm/build.sh
          cargo build --release --bin rad
      - name: Create release tarball
        run: |
          mkdir -p dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm/lib
          cp target/release/rad dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm/
          cp kernels/rocm/librad_ops.so dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm/lib/
          cp LICENSE README.md dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm/
          tar -C dist -czf dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm.tar.gz rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm
          sha256sum dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm.tar.gz > dist/SHA256SUMS.txt
      - name: Build .deb package
        run: |
          bash packaging/deb/build_deb.sh "${{ steps.ver.outputs.version }}"
          sha256sum dist/rad_${{ steps.ver.outputs.version }}_amd64.deb >> dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/rad-${{ steps.ver.outputs.version }}-linux-x86_64-rocm.tar.gz
            dist/rad_${{ steps.ver.outputs.version }}_amd64.deb
            dist/SHA256SUMS.txt

  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ROCm Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/metaspartan/rad:latest
            ghcr.io/metaspartan/rad:${{ github.ref_name }}
